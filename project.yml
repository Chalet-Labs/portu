name: Portu
options:
  bundleIdPrefix: com.portu
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  PortuCore:
    path: Packages/PortuCore
  PortuNetwork:
    path: Packages/PortuNetwork
  PortuUI:
    path: Packages/PortuUI
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.25.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"

targets:
  Portu:
    type: application
    platform: macOS
    sources:
      - path: Sources/Portu
        excludes:
          - Resources
    resources:
      - path: Sources/Portu/Resources/Assets.xcassets
    dependencies:
      - package: PortuCore
      - package: PortuNetwork
      - package: PortuUI
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portu.app
        INFOPLIST_FILE: Sources/Portu/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Portu/Resources/Portu.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PORTU_VERIFY_UPDATE_BEFORE_EXTRACTION: NO
      configs:
        Debug:
          PORTU_UPDATE_FEED_URL: "https://raw.githubusercontent.com/Chalet-Labs/portu/master/Tests/Fixtures/Updater/appcast.xml"
          PORTU_UPDATE_PUBLIC_KEY: "bwdTmUzcenVsxzIQb737hznwxvpJr7uveKIzVkxVd00="
          PORTU_UPDATE_OWNER: development
          PORTU_VERIFY_UPDATE_BEFORE_EXTRACTION: YES
        Release:
          PORTU_UPDATE_FEED_URL: "https://raw.githubusercontent.com/Chalet-Labs/portu/updates/appcast.xml"
          PORTU_UPDATE_PUBLIC_KEY: "cOsrWIKHer18euTD1qZi2KJ0Anxc+tW8UPl6da9Pmx4="
          PORTU_UPDATE_OWNER: directGitHub
          PORTU_VERIFY_UPDATE_BEFORE_EXTRACTION: YES
    entitlements:
      path: Sources/Portu/Resources/Portu.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true

  PortuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PortuTests
    dependencies:
      - target: Portu
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portu.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Portu:
    build:
      targets:
        Portu: all
        PortuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Test host only: suppress Sparkle's first-launch permission prompt modal.
      # Production prompt behavior stays enabled (no SUEnableAutomaticChecks in Info.plist).
      # Xcode passes each entry as ONE argv token; UserDefaults' argument domain
      # only parses -Key Value pairs from ADJACENT argv entries, so a single
      # "-SUEnableAutomaticChecks NO" token is inert. Two entries required.
      commandLineArguments:
        "-SUEnableAutomaticChecks": true
        "NO": true
      targets:
        - PortuTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
