name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The scope step diffs origin/<base>...HEAD, which needs the history of both
          fetch-depth: 0

      # Runs first, while the worktree is clean: the script also counts modified and untracked files.
      # The base ref reaches the script through env, never interpolated into the shell source.
      - name: Select test scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          groups="$(script/test_scope.sh --base "origin/$BASE_REF")"
          skip_all=false
          skip_release=false
          # Neither the selector nor this step can vouch for a change to itself: a broken one could skip the
          # tests that would catch it.
          if ! git diff --quiet "origin/$BASE_REF...HEAD" -- script/test_scope.sh script/test-scope.json .github/workflows/ci.yml; then
            plan="every suite, because the selector, its rules or this workflow changed"
          elif [ "$groups" = none ]; then
            skip_all=true
            skip_release=true
            plan="format and lint only"
          # Not printf | grep -q: grep can exit before printf is done, and pipefail would read that as no match.
          elif [[ $'\n'$groups$'\n' != *$'\n'release$'\n'* ]]; then
            skip_release=true
            plan="every suite except ReleaseAutomationTests"
          else
            plan="every suite"
          fi
          echo "skip_all=$skip_all" >> "$GITHUB_OUTPUT"
          echo "skip_release=$skip_release" >> "$GITHUB_OUTPUT"
          {
            echo "### Test scope"
            echo
            echo "Groups selected by changes since \`origin/$BASE_REF\`:"
            echo
            printf -- '- `%s`\n' $groups
            echo
            echo "Runs: $plan."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        env:
          SWIFTFORMAT_VERSION: 0.64.0
          SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98
        run: |
          brew install xcodegen just swiftlint git-tools
          # Pinned instead of the runner image's SwiftFormat, whose version moves and brings new rules
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Check formatting and lint
        run: |
          swiftformat --version
          swiftlint --version
          just format-check
          just lint-strict

      # The scope outputs are empty on push, so `!= 'true'` runs everything there.
      # A cache from another Xcode or other dependencies isn't reused; `latest-stable` moves.
      - name: Compute build cache key
        id: cache-key
        if: steps.scope.outputs.skip_all != 'true'
        env:
          DEPENDENCIES: ${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        run: |
          set -euo pipefail
          xcode="$(xcodebuild -version | awk '/^Build version/ { print $3 }')"
          test -n "$xcode"
          echo "prefix=build-$RUNNER_OS-xcode-$xcode-$DEPENDENCIES-" >> "$GITHUB_OUTPUT"

      # Restores the newest cache master saved for this prefix. A PR can't see another PR's caches.
      - name: Restore build cache
        id: cache
        if: steps.scope.outputs.skip_all != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      - name: PROBE restore mtimes
        if: steps.scope.outputs.skip_all != 'true'
        run: time git restore-mtime --commit-time

      - name: Generate Xcode project
        if: steps.scope.outputs.skip_all != 'true'
        run: just generate

      - name: Build for testing
        if: steps.scope.outputs.skip_all != 'true'
        run: just build-for-testing

      - name: Test
        if: false # PROBE: build only
        env:
          TEST_FILTERS: ${{ steps.scope.outputs.skip_release == 'true' && '-skip-testing:PortuTests/ReleaseAutomationTests' || '' }}
        # Unquoted: no filter passes no argument
        run: just test-without-building $TEST_FILTERS

      # Only master saves, and only after its tests pass: PR caches would evict master's under the repo's
      # 10 GB limit. A re-run of the same commit restores its own entry exactly, which can't be saved again.
      - name: Save build cache
        if: github.event_name == 'pull_request' # PROBE: save from this PR
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.sha }}

      - name: PROBE cache size
        if: always()
        run: du -sh .build .build/* .build/DerivedData/* .build/DerivedData/Logs/* || true
